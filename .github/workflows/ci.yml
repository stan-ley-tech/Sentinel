name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    name: Gateway (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  control-plane:
    name: Control Plane (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: control-plane/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  integration:
    name: End-to-end integration proof
    runs-on: ubuntu-latest
    needs: [gateway, control-plane]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: control-plane/requirements-dev.txt
      - name: Build gateway
        working-directory: gateway
        run: |
          npm ci
          npm run build
      - name: Install control-plane deps
        working-directory: control-plane
        run: pip install -r requirements-dev.txt
      - name: Run end-to-end proof
        run: python test/integration/run_e2e.py
